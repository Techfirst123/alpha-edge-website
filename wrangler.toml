name = "alpha-edge-website"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# R2 bucket for admin-uploaded images (see functions/_lib/imageStorage.js
# and functions/uploads/[[path]].js). Create the bucket first:
#   npx wrangler r2 bucket create alpha-edge-uploads
# then this binding makes it available in every Function as env.UPLOADS_BUCKET.
[[r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "alpha-edge-uploads"

# Secrets/env vars (MONGODB_URI, ADMIN_SESSION_SECRET, ADMIN_EMAIL,
# ADMIN_PASSWORD, RESEND_API_KEY, CONTACT_FROM_EMAIL, CONTACT_TO_EMAIL) are
# NOT set here — set them in the Cloudflare Pages dashboard under
# Settings -> Environment variables (Production and Preview), or via
# `npx wrangler pages secret put <NAME>`. See .env.example for the full list
# and README.md for step-by-step instructions.
